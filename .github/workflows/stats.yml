
name: Actualizar estadísticas GitHub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generar estadísticas generales
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Sam-ai06&show_icons=true&include_all_commits=true&theme=dark_github
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar estadísticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || git commit -m "Actualizar estadísticas"
          git push
